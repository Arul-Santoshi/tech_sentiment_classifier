name: Daily Sentiment-Market Pipeline

on:
  schedule:
    # Run daily at 8 AM UTC (3 AM EST / 4 AM EDT)
    # Before pre-market opens, captures overnight news for same-day correlation
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      articles:
        description: 'Number of articles to fetch'
        required: false
        default: '100'
      backfill_days:
        description: 'Days of stock data to backfill'
        required: false
        default: '7'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download existing database from previous runs
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: sentiment-market-db
          path: data/
          workflow: daily_sentiment.yml
          workflow_conclusion: ""
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: Initialize database if needed
        run: python -m market_analysis.daily_runner init

      - name: Check NewsAPI key
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          if [ -z "$NEWSAPI_KEY" ]; then
            echo "::warning::NEWSAPI_KEY secret is not set. News fetching will be skipped."
            echo "SKIP_NEWS=true" >> $GITHUB_ENV
          else
            echo "SKIP_NEWS=false" >> $GITHUB_ENV
          fi

      - name: Run daily pipeline
        if: env.SKIP_NEWS != 'true'
        continue-on-error: true
        id: pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python -m market_analysis.daily_runner run \
            --articles ${{ github.event.inputs.articles || '100' }} \
            --days 1

      - name: Report pipeline status
        if: always()
        run: |
          if [ "${{ steps.pipeline.outcome }}" == "failure" ]; then
            echo "::warning::Daily pipeline failed - this may be due to NewsAPI rate limits or key issues. Stock backfill will still proceed."
          fi

      - name: Backfill stock data
        run: |
          python -m market_analysis.daily_runner backfill \
            --days ${{ github.event.inputs.backfill_days || '7' }}

      - name: Generate correlation report
        continue-on-error: true
        run: |
          if [ -f "data/sentiment_market.db" ]; then
            python -m market_analysis.correlation > correlation_report.txt || echo "Correlation report generation failed (may need more data)"
          else
            echo "No database found - skipping correlation report" > correlation_report.txt
          fi

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-market-db
          path: data/sentiment_market.db
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload correlation report
        uses: actions/upload-artifact@v4
        with:
          name: correlation-report-${{ github.run_number }}
          path: correlation_report.txt
          retention-days: 30

      - name: Commit updated database (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/sentiment_market.db || true
          git diff --staged --quiet || git commit -m "chore: update sentiment-market database [skip ci]"
          git push || true
